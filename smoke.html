<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>smoke</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
<script defer>
window.addEventListener('load', () => {
  const out = [];
  const snap = (label) => out.push(label + ' | cols= ' +
    state.columns.map((c) => c.panels.map((pid) => state.panels.get(pid).kind).join('+')).join(' / ') +
    ' | joins= ' + [...state.joins].map(([a, b]) => state.panels.get(a).kind + '>' + state.panels.get(b).kind).join(', '));
  try {
    const inbox = [...state.panels.values()].find((p) => p.kind === 'email/inbox');
    snap('boot');
    followLink(inbox, { kind: 'email/message', params: { id: 'm1' } }, 'open', false);
    snap('open m1 from inbox (joined)');
    const msg = [...state.panels.values()].find((p) => p.kind === 'email/message');
    followLink(inbox, { kind: 'email/message', params: { id: 'm2' } }, 'open', false);
    snap('open m2 (must replace joined panel)');
    followLink(msg, { kind: 'contact', params: { email: 'notifications@github.com' } }, 'open', false);
    snap('contact from message (joined chain)');
    followLink(inbox, { kind: 'email/message', params: { id: 'm3' } }, 'open', false);
    snap('open m3 (must replace joined AND cascade-close contact)');
    followLink(msg, { kind: 'contact', params: { email: 'max@ivanov.dev' } }, 'open', false);
    snap('contact again');
    followLink(msg, { kind: 'email/message', params: { id: 'm4' } }, 'replace', false);
    snap('dotted replace msg -> m4 (must cascade-close contact)');
    movePanel(inbox.id, 'left');
    snap('move INBOX left (pair no longer adjacent -> must un-join)');
    followLink(inbox, { kind: 'email/message', params: { id: 'm5' } }, 'open', false);
    snap('open m5 (no join left -> must open NEW joined panel right of inbox)');
    const msg2 = [...state.panels.values()].filter((p) => p.kind === 'email/message').find((p) => p.params.id === 'm5');
    followLink(inbox, { kind: 'email/message', params: { id: 'm6' } }, 'open', true);
    snap('alt-open m6 (separate panel, join to m5 must survive)');
    closePanel(msg2.id);
    snap('close m5 (must drop its join)');
    document.title = 'TESTOK';
  } catch (err) {
    out.push('FAIL: ' + err.message + '\n' + err.stack);
    document.title = 'TESTFAIL';
  }
  const pre = document.createElement('pre');
  pre.id = 'test-out';
  pre.textContent = out.join('\n');
  document.body.append(pre);
});
</script>
</head>
<body>
  <div id="workspace"><div id="strip"></div></div>
</body>
</html>
