[workspace]
members = ["kernel", "app"]
resolver = "2"

# The Makepad fork adds eleven fixes. Rebase them when updating the pin:
#
#   bdb23508  Keep the mobile keyboard open when focus moves between fields.
#   5bf8e78f  Let a dismissed mobile keyboard reopen when its field is tapped.
#   99b2a58f  Allow screenshots while the window is hidden, when enabled.
#   5d491eea  Send trackpad pinch events to the Panels Library zoom control.
#   d7795f23  Remove dark bands between selected lines with padding.
#   2f6136e2  Answer the macOS caret chords, and take a word or a line by clicks.
#   f6280419  Take a word or a paragraph out of a text flow by clicks.
#   5068386d  Let an app count the presses it synthesizes itself.
#   4a63070f  Let it hand the pointer back on the release, too.
#   c85d1a7a  Delete nothing on a shifted control chord.
#   a80eae68  Extend text selections from their anchor on Shift-click.
#
# `../makepad-superapp` is the local working copy. Builds use the revision below.
[patch."https://github.com/makepad/makepad"]
makepad-widgets = { git = "https://github.com/prepor/makepad", rev = "a80eae68" }
makepad-objc-sys = { git = "https://github.com/prepor/makepad", rev = "a80eae68" }
makepad-apple-sys = { git = "https://github.com/prepor/makepad", rev = "a80eae68" }

[profile.dev]
opt-level = 1

# Ghostty's debug checks are expensive on every parsed byte. Keep the Rust
# app debuggable while building the pinned VT library in ReleaseFast mode.
[profile.dev.package.libghostty-vt-sys]
debug = false

[profile.release]
opt-level = 3
