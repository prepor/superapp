# Standalone package; the empty [workspace] table stops cargo from walking up
# the tree looking for a workspace root (same defence as mosaic's crates).
[workspace]

[package]
name = "superapp"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Personal user-space OS: specialized panels on one scrolling workspace."
publish = false

[lib]
name = "superapp"
path = "src/lib.rs"

[[bin]]
name = "superapp"
path = "src/main.rs"

[dependencies]
# Upstream makepad, pinned to the same commit mosaic's vendor pipeline uses
# (makepad@dev). Plain upstream — none of mosaic's patches; the one superapp
# used was 0003 (present-when-occluded, for background e2e runs), dropped as
# an experiment: if occluded e2e suites go stale, run them with --front.
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "9daab06dcf2dd8d0f6259e146db21a21d0515f17" }

[target.'cfg(target_os = "macos")'.dependencies]
makepad-objc-sys = { git = "https://github.com/makepad/makepad", rev = "9daab06dcf2dd8d0f6259e146db21a21d0515f17" }
makepad-apple-sys = { git = "https://github.com/makepad/makepad", rev = "9daab06dcf2dd8d0f6259e146db21a21d0515f17" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
