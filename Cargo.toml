# Standalone package; the empty [workspace] table stops cargo from walking up
# the tree looking for a workspace root (same defence as mosaic's crates).
[workspace]

[package]
name = "superapp"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Personal user-space OS: specialized panels on one scrolling workspace."
publish = false

[lib]
name = "superapp"
path = "src/lib.rs"

[[bin]]
name = "superapp"
path = "src/main.rs"

[dependencies]
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
mail-parser = "0.11"
# makepad@dev, re-pinned 2026-09-01 to then-HEAD (53 commits past mosaic's
# vendor pin; fast-forward, zero source drift, full battery green). None of
# mosaic's patches; the one superapp used was 0003 (present-when-occluded,
# for background e2e runs), dropped as an experiment: if occluded e2e
# suites go stale, run them with --front. Two patches of our own now ride
# on top — see the [patch] section at the bottom. The API reference is the
# ~/.cargo git checkout of the fork rev (mosaic's vendored tree lags it).
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "0e19a65eac37ac15f2c230a32a36d29520a39524" }

# The one store: bundled SQLite (same pin rel.systems validated) so the hook
# surface and version are identical on macOS and android. `hooks` powers the
# query layer's table-level invalidation (update_hook); `session` records
# every action's transaction as an invertible changeset — the undo system
# (CR-001 phase 2). session ⇒ buildtime_bindgen: bindgen runs on the host
# for both targets (verified on the android cross-build).
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }

# CR-004: effects are serializable values, and the deferred ones are JSON
# payloads in the `effect` table. serde is already in the graph transitively;
# serde_json is the one new crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
makepad-objc-sys = { git = "https://github.com/makepad/makepad", rev = "0e19a65eac37ac15f2c230a32a36d29520a39524" }
makepad-apple-sys = { git = "https://github.com/makepad/makepad", rev = "0e19a65eac37ac15f2c230a32a36d29520a39524" }

# Three patches on top of the pin, carried on prepor/makepad@superapp-pin
# (branched at the pin; rebase them when bumping it):
#
#   bdb23508  TextInput hides the IME only when key focus goes to nothing —
#             the unconditional hide-on-blur closed and reopened the
#             keyboard on every field-to-field move (mobile "next", tab).
#   5bf8e78f  A dismissed keyboard is not hidden again (Samsung re-presents
#             it to replay the animation: dismissals "closed twice"), and a
#             tap on a field clears the dismissed latch, so a re-tap on the
#             focused field can raise the keyboard again.
#   99b2a58f  MAKEPAD_PRESENT_WHEN_OCCLUDED=1 keeps an occluded window
#             presenting — mosaic's patch 0003, rebased. Headless e2e runs
#             stay behind the user's windows on purpose and must still
#             photograph what they draw; without it, captures are stale
#             frames. background_run() sets the variable itself.
#
# A local clone at ../makepad-superapp is the working tree for them; the
# git rev below is what actually builds, here and anywhere else.
[patch."https://github.com/makepad/makepad"]
makepad-widgets = { git = "https://github.com/prepor/makepad", rev = "99b2a58f923cc0ebf5f562b084d9e3eb1006522f" }
makepad-objc-sys = { git = "https://github.com/prepor/makepad", rev = "99b2a58f923cc0ebf5f562b084d9e3eb1006522f" }
makepad-apple-sys = { git = "https://github.com/prepor/makepad", rev = "99b2a58f923cc0ebf5f562b084d9e3eb1006522f" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
