# Standalone package; the empty [workspace] table stops cargo from walking up
# the tree looking for a workspace root (same defence as mosaic's crates).
[workspace]

[package]
name = "superapp"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Personal user-space OS: specialized panels on one scrolling workspace."
publish = false

[lib]
name = "superapp"
path = "src/lib.rs"

[[bin]]
name = "superapp"
path = "src/main.rs"

[dependencies]
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
mail-parser = "0.11"
# Upstream makepad@dev, re-pinned 2026-09-01 to current HEAD (53 commits
# past mosaic's vendor pin; fast-forward, zero source drift, full battery
# green). Plain upstream — none of mosaic's patches; the one superapp used
# was 0003 (present-when-occluded, for background e2e runs), dropped as an
# experiment: if occluded e2e suites go stale, run them with --front. The
# API reference is the ~/.cargo git checkout of this rev (mosaic's vendored
# tree lags it).
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "0e19a65eac37ac15f2c230a32a36d29520a39524" }

# The one store: bundled SQLite (same pin rel.systems validated) so the hook
# surface and version are identical on macOS and android. `hooks` powers the
# query layer's table-level invalidation (update_hook); `session` records
# every action's transaction as an invertible changeset — the undo system
# (CR-001 phase 2). session ⇒ buildtime_bindgen: bindgen runs on the host
# for both targets (verified on the android cross-build).
rusqlite = { version = "0.40", features = ["bundled", "hooks", "session"] }

[target.'cfg(target_os = "macos")'.dependencies]
makepad-objc-sys = { git = "https://github.com/makepad/makepad", rev = "0e19a65eac37ac15f2c230a32a36d29520a39524" }
makepad-apple-sys = { git = "https://github.com/makepad/makepad", rev = "0e19a65eac37ac15f2c230a32a36d29520a39524" }

# One patch on the pin (local clone of the same rev + commit bdb23508,
# branch superapp-pin): TextInput keeps the soft keyboard up when key
# focus moves to another widget — upstream hides it unconditionally on
# blur, which closes and reopens the keyboard on every mobile "next".
# Worth offering upstream; until then this override carries it.
[patch."https://github.com/makepad/makepad"]
makepad-widgets = { path = "../makepad-superapp/widgets" }
makepad-objc-sys = { path = "../makepad-superapp/libs/objc-sys" }
makepad-apple-sys = { path = "../makepad-superapp/libs/apple_sys" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
