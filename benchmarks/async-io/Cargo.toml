[package]
name = "superapp-async-io-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: the archived synchronous client is only a benchmark dependency.
[workspace]

[dependencies]
tokio = { version = "1.48", features = ["rt", "macros", "net", "io-util", "time", "sync", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
ureq = "3.4"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
serde_json = "1"
