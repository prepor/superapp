# The app icon. makepad's platform/build.rs bakes the PNGs these name into
# the binary (the dock icon of a plain `cargo run`); it would also find
# `app/resources/icon_*.png` on its own, but only by walking up from OUT_DIR
# to the directory holding `target/`, which a custom CARGO_TARGET_DIR or an
# explicit `--target` breaks. `app/resources/make_icons.py` generates the
# files. The paths are relative to this directory's parent, the workspace
# root, so they hold wherever cargo is invoked from.
[env]
MAKEPAD_APP_ICON_32 = { value = "app/resources/icon_32.png", relative = true }
MAKEPAD_APP_ICON_64 = { value = "app/resources/icon_64.png", relative = true }
MAKEPAD_APP_ICON_128 = { value = "app/resources/icon_128.png", relative = true }
MAKEPAD_APP_ICON_256 = { value = "app/resources/icon_256.png", relative = true }
MAKEPAD_APP_ICON_512 = { value = "app/resources/icon_512.png", relative = true }
MAKEPAD_APP_ICON_1024 = { value = "app/resources/icon_1024.png", relative = true }
MAKEPAD_APP_ICON_ICO = { value = "app/resources/icon.ico", relative = true }

# NTgCalls, which carries a call's media. The `ntgcalls-sys` crate links the
# published *static* archive by default, and that archive does not link at all
# with the linker Xcode 26 ships: `ld` asserts inside its own relocation parser
# on the ffmpeg objects in it (`findRealAtom`, Relocations.cpp), and neither
# `-ld_classic` nor `-no_compact_unwind` gets past it. The shared library of
# the same release links and runs, so that is what this build uses:
# `app/build.rs` fetches it into the directory named here on the first build
# and adds the -rpath the binary finds it by. An `NTGCALLS_LIB_DIR` exported
# in the environment wins over this, which is how `./android.sh` points the
# same crate at its own prefix.
NTGCALLS_DYLIB = "1"
NTGCALLS_LIB_DIR = { value = "target/ntgcalls/lib", relative = true }
