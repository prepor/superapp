[package]
name = "superapp-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Everything generic that does not draw: the panel model, the store, effects, the rich table state."
publish = false

[lib]
name = "kernel"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
async-trait = "0.1"
futures-util = { version = "0.3", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
tokio-util = { version = "0.7", features = ["io"] }
# Bundle SQLite so macOS and Android use the same version. Hooks refresh cached
# queries; sessions record changes for device sync.
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks", "session"] }

# Unicode case folding for text filters, including scripts outside ASCII.
caseless = "0.2.2"

# Deferred effects use JSON payloads in the `effect` table.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Device sync signs its requests and reaches a real bucket over TLS: these
# provide encoding, signing, secure connections, and trusted certificate
# roots.
base64 = "0.22"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
# Advisory process lock before opening/migrating a file-backed store.
# std::fs::File::try_lock requires a newer compiler than our MSRV.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }
tempfile = "3"
