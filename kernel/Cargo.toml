[package]
name = "superapp-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Everything generic that does not draw: the panel model, the store, effects, the rich table state."
publish = false

[lib]
name = "kernel"
path = "src/lib.rs"

[dependencies]
# Bundle SQLite so macOS and Android use the same version. Hooks refresh cached
# queries; sessions record changes for device sync.
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks", "session"] }

# Deferred effects use JSON payloads in the `effect` table.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Device sync signs its requests and reaches a real bucket over TLS: these
# provide encoding, signing, secure connections, and trusted certificate
# roots.
base64 = "0.22"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-connector = "0.19"
webpki-roots = "1"
