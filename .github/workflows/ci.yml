name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes the run in flight: macOS minutes
# bill at 10× on a private repo, and a superseded run proves nothing anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, not a lint job beside a test job: building the makepad graph *is*
  # the cost of a run, and two jobs would pay it twice for no extra signal.
  check:
    name: clippy + tests + e2e
    # macOS is the target platform — `makepad-objc-sys`/`makepad-apple-sys` and
    # the keychain in `app/src/platform/` are cfg'd to it, so a linux runner
    # would be checking a different dependency graph than the one that ships.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # `stable`, the same channel mise.toml pins for local work — plus the
      # linter. No `cargo fmt --check` gate: the tree is not rustfmt-clean by
      # choice (hand-laid tables and comment columns), and a check would be
      # red on hundreds of untouched files.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches the registry, the two makepad git checkouts and `target/`,
      # keyed on the lockfile and the toolchain. `cache-on-failure` because
      # the common failure here is a red clippy or a failed step, and the
      # graph that got built on the way to it is just as good — without it
      # a lint slip costs the next push a cold build of all of makepad.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `--workspace`, so the kernel is linted with the app rather than only
      # through it, and `--locked` so a Cargo.lock left behind by an edited
      # manifest fails here instead of being quietly re-resolved.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The pure suite, both crates: the kernel's panel mechanics, springs,
      # store, effects, history and device sync, and the app's own — the mail
      # engine, the files model, and the two boundary tests that keep the
      # split honest. All against fakes: no window, no network, no keychain.
      - name: tests
        run: cargo test --workspace --locked

      # The e2e battery: every single-process suite replayed against the
      # shell's real input paths, through makepad's headless backend. Last,
      # because `MAKEPAD=headless` is a *build-time* switch — build.rs turns
      # it into cfg(headless) — so it re-does the crates that read it and
      # leaves the earlier steps' artifacts alone until then.
      #
      # `--no-draw` (inside run-all.sh) runs the full widget draw pass and
      # rasterizes nothing: hits and labels resolve exactly as they do with
      # pictures, at ~80× less cost — the whole battery in a couple of
      # seconds. A failure here is a label that did not resolve.
      #
      # `e2e/sync/` is not in it: those walks are two devices over one
      # bucket, so each needs a second process and a `bucketd` beside it.
      - name: e2e
        env:
          MAKEPAD: headless
        run: |
          cargo build --locked -p superapp
          ./e2e/run-all.sh
